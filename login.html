<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Tenant CRM - Iniciar Sesion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- PWA Meta Tags -->  
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tenant CRM">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png">
    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
</head>
<body class="bg-gradient-to-br from-surface-dark to-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary-600/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-pulse-slow"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-purple-600/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-pulse-slow" style="animation-delay: 1.5s"></div>

    <div class="max-w-md w-full space-y-8 glass-card p-10 rounded-3xl shadow-2xl animate-fade-in relative z-10">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-purple-600 mb-4 shadow-neon">
                <i class="fas fa-building text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl font-display font-bold text-white mb-2 tracking-tight">Tenant CRM</h1>
            <p class="text-slate-400 text-sm font-medium">Gestión Profesional de Inquilinos</p>
        </div>
        
        <!-- ===== LOGIN CON NETLIFY IDENTITY ===== -->
        <div class="mt-8">
            <button id="netlifyLoginBtn" 
                    class="w-full bg-gradient-to-r from-primary-600 to-primary-500 text-white py-3.5 px-4 rounded-xl hover:from-primary-500 hover:to-primary-400 transition-all text-base font-semibold flex justify-center items-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                Iniciar sesión con Netlify
            </button>
            
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-700/50"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-slate-800 text-slate-400">o</span>
                </div>
            </div>

            <!-- Formulario de login para admin existente -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Usuario</label>
                    <input type="text" id="username" required 
                           class="w-full px-5 py-3.5 bg-slate-800/40 border border-slate-700/50 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all text-base text-white placeholder-slate-500"
                           placeholder="Ingresa tu usuario">
                    <div class="field-error text-red-400 text-sm mt-1 hidden"></div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Contraseña</label>
                    <input type="password" id="password" required 
                           class="w-full px-5 py-3.5 bg-slate-800/40 border border-slate-700/50 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all text-base text-white placeholder-slate-500"
                           placeholder="Ingresa tu contraseña">
                    <div class="field-error text-red-400 text-sm mt-1 hidden"></div>
                </div>
                <button type="submit" 
                        class="w-full bg-slate-700 text-white py-3.5 px-4 rounded-xl hover:bg-slate-600 transition-all text-base font-semibold">
                    Iniciar sesión
                </button>
            </form>
        </div>

        <div id="errorMessage" class="text-red-400 bg-red-900/20 border border-red-900/50 p-3 rounded-lg text-sm text-center hidden"></div>
        <div id="successMessage" class="text-green-400 bg-green-900/20 border border-green-900/50 p-3 rounded-lg text-sm text-center hidden"></div>

        <div class="text-center text-sm text-slate-400 mt-4">
            ¿No tienes cuenta? <a href="/register.html" class="text-primary-400 hover:text-primary-300 transition-colors">Regístrate</a>
        </div>
    </div>

    <script src="/js/shared/utils.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ===== INICIALIZAR NETLIFY IDENTITY =====
            if (window.netlifyIdentity) {
                window.netlifyIdentity.init({
                    locale: 'es'
                });

                // Botón de login con Netlify
                document.getElementById('netlifyLoginBtn').addEventListener('click', function() {
                    window.netlifyIdentity.open('login');
                });

                // Escuchar eventos de autenticación
                window.netlifyIdentity.on('login', function(user) {
                    console.log('Usuario autenticado con Netlify Identity:', user);
                    
                    const role = user.user_metadata?.role || 'viewer';
                    const userName = user.user_metadata?.full_name || user.email || 'Usuario';
                    
                    const userData = {
                        username: user.email,
                        name: userName,
                        role: role,
                        netlify_id: user.id,
                        email: user.email
                    };
                    
                    sessionStorage.setItem('authToken', 'netlify-' + (user.token?.access_token || 'demo'));
                    sessionStorage.setItem('user', JSON.stringify(userData));
                    sessionStorage.setItem('netlify_user', JSON.stringify(user));
                    
                    window.location.href = '/dashboard.html';
                });

                window.netlifyIdentity.on('logout', function() {
                    console.log('Usuario desconectado de Netlify Identity');
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('user');
                    sessionStorage.removeItem('netlify_user');
                });

                const currentUser = window.netlifyIdentity.currentUser();
                if (currentUser) {
                    console.log('Usuario de Netlify Identity ya logueado:', currentUser);
                    window.netlifyIdentity.emit('login', currentUser);
                }
            }

            // ===== LOGIN LEGACY (admin/admin123) =====
            const loginForm = document.getElementById('loginForm');
            const errorDiv = document.getElementById('errorMessage');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const usernameInput = document.getElementById('username');
                    const passwordInput = document.getElementById('password');
                    
                    UI.clearAllFieldErrors(loginForm);
                    errorDiv.classList.add('hidden');
                    
                    let isValid = true;
                    
                    if (!usernameInput.value.trim()) {
                        UI.showFieldError(usernameInput, 'El usuario es obligatorio');
                        isValid = false;
                    }
                    
                    if (!passwordInput.value.trim()) {
                        UI.showFieldError(passwordInput, 'La contraseña es obligatoria');
                        isValid = false;
                    }
                    
                    if (!isValid) return;
                    
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Verificando...';
                    submitBtn.disabled = true;
                    
                    try {
                        if (window.AUTH && typeof window.AUTH.login === 'function') {
                            const result = await window.AUTH.login(usernameInput.value, passwordInput.value);
                            if (result.success) {
                                window.location.href = '/dashboard.html';
                            }
                        } else {
                            throw new Error('Sistema de autenticación no disponible');
                        }
                    } catch (error) {
                        errorDiv.textContent = error.message || 'Error al iniciar sesión';
                        errorDiv.classList.remove('hidden');
                    } finally {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>

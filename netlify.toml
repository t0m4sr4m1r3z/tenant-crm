[build]
  functions = "netlify/functions"
  publish = "."

[dev]
  framework = "#static"
  publish = "."
  port = 8888

# Headers de seguridad, PWA y caché
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirecciones para rutas limpias (SPA)
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/tenants"
  to = "/tenants.html"
  status = 200

[[redirects]]
  from = "/owners"
  to = "/owners.html"
  status = 200

[[redirects]]
  from = "/properties"
  to = "/properties.html"
  status = 200

[[redirects]]
  from = "/contracts"
  to = "/contracts.html"
  status = 200

[[redirects]]
  from = "/payments"
  to = "/payments.html"
  status = 200

[[redirects]]
  from = "/calendar"
  to = "/calendar.html"
  status = 200

[[redirects]]
  from = "/reports"
  to = "/reports.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/settings.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

# Redirección de API a Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback para rutas inexistentes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200